# Use hekla's own language server for this repository's `.star` files, in place of
# Helix's default starpls (which serves Bazel's dialect, so every hekla builtin
# reads as undefined and every `load()` resolves against the wrong root).
#
# Requires `hekla` on PATH: `cargo install --path .`, or point `command` at
# `target/debug/hekla`.
#
# Formatting stays with buildifier from the global config: the server advertises
# no formatting capability.

[language-server.hekla]
command = "hekla"
args = ["lsp"]

[[language]]
name = "starlark"
language-servers = ["hekla"]
