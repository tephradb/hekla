name: ci

# Checks on every push to main and every pull request: formatting, clippy, tests, rustdoc,
# the declared MSRV, and the dependency audit. Green here means the tree is correct and
# clean.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Canonical formatting. Does not build, so it needs no cache.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Everything compiles cleanly and lint-free: lib, bin, and tests. This is the primary
  # "it builds" gate. rusqlite is bundled, so this compiles SQLite from C as well.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Unit, integration, and doctests. Not --all-targets, so doctests actually run. The
  # integration tests read examples/ and tests/fixtures/ from the source tree.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Rustdoc with warnings denied, catching broken intra-doc links and other doc warnings.
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

  # Verify the declared minimum supported Rust version still builds. 1.95.0 is what tephra
  # and seglog require, and they set the floor for the whole graph.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.95.0 check --workspace --all-features

  # Dependency audit: security advisories, license policy, banned/duplicate crates, sources.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
