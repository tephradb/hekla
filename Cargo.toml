[package]
name = "hekla"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
aes-siv = "0.8"
anyhow = "1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
heklang = { path = "../heklang" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `arbitrary_precision` is load-bearing, not a preference: without it a
# `Value::Number` is an `f64` and hekla hands heklang text that has already been
# rounded, so `Json::Num`'s byte-for-byte guarantee would stop at this boundary.
# `10.50` would reach the log as `10.5`.
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
tempfile = "3"
tephra = { version = "0.3.6", features = ["async", "tracing"] }
time = { version = "0.3", features = ["formatting"] }
# `full` pulled in fs, process, io-std and the rest; these four are what the code
# actually reaches for. `macros` is test-only (`#[tokio::test]`), so it sits in
# dev-dependencies: there is no `#[tokio::main]`, cli.rs builds the runtime by hand.
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
zeroize = "1"

[dev-dependencies]
oas3 = { version = "0.22.0", default-features = false }
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
