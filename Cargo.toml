[package]
name = "kiln"
version = "0.1.0"
edition = "2024"

[dependencies]
allocative = "0.3"
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
starlark = "0.14"
tempfile = "3"
# Pinned to the fail_if_exists existence-clause commit (tephra PR #31), unreleased.
# Switch to a crates.io version once tephra publishes it.
tephra = { git = "https://github.com/tephradb/tephra", rev = "56b2af215914ccdd20f154af30e5c782c59c036a", features = ["async", "tracing"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
