[package]
name = "kiln"
version = "0.1.0"
edition = "2024"

[dependencies]
allocative = "0.3.6"
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starlark = { version = "0.14.2", features = [] }
tephra = { version = "0.3.5", features = ["async", "tracing"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
