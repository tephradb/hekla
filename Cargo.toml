[package]
name = "hekla"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
aes-siv = "0.8"
allocative = "0.3"
anyhow = "1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
# Both are pinned to what starlark_lsp 0.14 was built against rather than to the
# newest release (lsp-server is at 0.10). A `Connection` is handed to it and a
# `CompletionItemKind` comes back from it, so a skew would give two same-named
# types that do not unify.
lsp-server = "0.7"
lsp-types = "=0.97"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
starlark = "0.14"
# Must track `starlark` exactly: the LSP trait takes starlark's own `AstModule`,
# `Globals` and `DocModule`, so a version skew would give two of each.
starlark_lsp = "0.14"
tempfile = "3"
tephra = { version = "0.3.6", features = ["async", "tracing"] }
time = { version = "0.3", features = ["formatting"] }
# `full` pulled in fs, process, io-std and the rest; these four are what the code
# actually reaches for. `macros` is test-only (`#[tokio::test]`), so it sits in
# dev-dependencies: there is no `#[tokio::main]`, cli.rs builds the runtime by hand.
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
zeroize = "1"

[dev-dependencies]
oas3 = { version = "0.22.0", default-features = false }
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
