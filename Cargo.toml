[package]
name = "hekla"
description = "A single-app event-sourcing runtime over the Dynamic Consistency Boundary, written in heklang"
version = "0.1.1"
edition = "2024"
rust-version = "1.95.0"
authors = ["Ari Seyhun <dev@tqwewe.com>"]
license = "MIT OR Apache-2.0"
repository = "https://git.tqwewe.com/tephra/hekla"
categories = ["database-implementations", "web-programming"]
keywords = ["event-sourcing", "dcb", "event-store", "runtime", "sqlite"]

# `ui/` reaches the binary through `include_bytes!` and `examples/` and `tests/fixtures/`
# are read from `CARGO_MANIFEST_DIR` at run time, so this is an `exclude` and never an
# `include`: a list that missed one of them would break the publish-verify build. What is
# dropped is what only describes this checkout.
exclude = ["scripts/", "proptest-regressions/", ".helix/", ".claude/", "devenv.*", "flake.*", ".forgejo/", "deny.toml"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[dependencies]
aes-gcm = "0.11"
aes-siv = "0.8"
anyhow = "1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
heklang = "0.2.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# `arbitrary_precision` is load-bearing, not a preference: without it a
# `Value::Number` is an `f64` and hekla hands heklang text that has already been
# rounded, so `Json::Num`'s byte-for-byte guarantee would stop at this boundary.
# `10.50` would reach the log as `10.5`.
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
tempfile = "3"
tephra = { version = "0.3.6", features = ["async", "tracing"] }
time = { version = "0.3", features = ["formatting"] }
# `full` pulled in fs, process, io-std and the rest; these four are what the code
# actually reaches for. `macros` is test-only (`#[tokio::test]`), so it sits in
# dev-dependencies: there is no `#[tokio::main]`, cli.rs builds the runtime by hand.
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
zeroize = "1"

[dev-dependencies]
oas3 = { version = "0.22.0", default-features = false }
# `fork` and `timeout` (and with them `rusty-fork` and `wait-timeout`) run each case in
# a subprocess. Nothing here needs that: a case that hangs is caught by the harness's own
# poll budget, which panics with a diagnostic rather than being killed by a signal.
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
tokio = { version = "1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
